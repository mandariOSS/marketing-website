name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "true"
      WEBSITE_DATABASE_URL: "sqlite:///ci.sqlite3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install .

      - name: Django system check
        run: python manage.py check

      - name: Unit-Tests (retire_page, SEO, Weiterleitungen, Sitemap, Releases)
        run: python manage.py test --buffer

      - name: Template-Kommentare prüfen (kein mehrzeiliges {# … #})
        run: python scripts/check_template_comments.py templates

      - name: Tailwind-CSS bauen (wie im Docker-Build)
        run: |
          npm ci
          npm run build:css

      - name: CSS-Build-Check (Safelist-Klassen im kompilierten CSS)
        # Die Block-Templates setzen Farbklassen dynamisch zusammen
        # (bg-{{ card.color }}-600 u. ä.) — dieser Check stellt sicher, dass
        # der Tailwind-Build alle Palette-Klassen enthält und nicht wieder
        # Klassen wegpurged (Safelist in tailwind.config.js).
        run: |
          python - <<'EOF'
          css = open("static/css/styles.css", encoding="utf-8").read()
          colors = ["primary", "green", "blue", "amber", "rose", "teal", "gray"]
          needles = []
          for c in colors:
              needles += [
                  f".bg-{c}-100", f".bg-{c}-600",
                  f".hover\\:bg-{c}-700:hover",
                  f".text-{c}-600", f".border-{c}-200",
              ]
          missing = [n for n in needles if n not in css]
          assert not missing, f"Klassen fehlen im kompilierten CSS: {missing}"
          print(f"OK: {len(needles)} Klassen im CSS vorhanden")
          EOF

      - name: Migrationen (frische SQLite)
        run: python manage.py migrate --no-input

      - name: Seiten-Seeds + Rechtstexte laden
        run: |
          python manage.py setup_initial_pages
          python - <<'EOF'
          from marketing.legal_content import load_legal_content
          content = load_legal_content()
          expected = {"impressum", "agb", "datenschutz", "avv", "kuendigung"}
          missing = expected - set(content)
          assert not missing, f"Rechtstexte fehlen: {missing}"
          print(f"OK: {sorted(content)}")
          EOF

      - name: StreamField-Seeds anwenden
        run: python manage.py migrate_pages_to_streamfield

      - name: Unternehmensseiten und Kontaktformular (Tests)
        # Inhalte und Sie-Form, Stufenschalter Vorgründung/Gesellschaft, Logo-Paket, Weiterleitung
        # /ueber-uns/, Seed-Befehle sowie die Formulare mit Spamschutz, Prüfung und Zustellung.
        run: python manage.py test company --buffer

      - name: Render-Smoke (alle Kernseiten liefern 200 mit Inhalt)
        run: |
          python - <<'EOF'
          import os, django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "website.settings")
          os.environ.setdefault("ALLOWED_HOSTS", "testserver")
          django.setup()
          from django.test import Client
          c = Client()
          # URL -> Textbausteine, die im gerenderten HTML stehen muessen
          checks = {
              "/": ["Software für die offene Verwaltung", "Erstgespräch vereinbaren", "Ratsinformationen im Bürgerportal ansehen", "insight-muenster-1280.webp"],
              "/produkte/": ["Heute im Einsatz", 'id="insight"', "Welches Modul kann was", "Was sich anbinden lässt"],
              "/fraktionen/": ["Politik machen statt PDFs sortieren", "Funktioniert mit dem RIS Ihrer Kommune", "39,90", 'id="funktionen"'],
              "/preise/": ["39,90", "33,53", "Wer macht was"],
              "/kommunen/": ["Ratsinformations", "Zwei Wege zur Anbindung", "Pilotkommunen gestalten mit."],
              "/migration/": ["Bestandsaufnahme"],
              "/roadmap/": ["Verbindlichkeitsstufen", "Pilotbetrieb"],
              "/vergabe/": ["Beschaffung und Prüfung", "Vertragsgrundlagen"],
              "/unternehmen/": ["Unser Wertekompass", "Angaben zum Unternehmen", "Lernen wir uns kennen."],
              "/karriere/": ["Bau mit an der Software", "Initiativ bewerben"],
              "/presse/": ["Kurzprofil", "Fakten und Kennzahlen", "Logo-Paket herunterladen"],
              "/partner/": ["Vier Wege, mit uns zu arbeiten", "So entsteht eine Partnerschaft"],
              "/open-source/": ["Öffentliches Geld. Öffentlicher Code.", "Auf wessen Schultern wir stehen"],
              "/vergleich/": ["mandari vs. Sternberg SD.NET", "mandari vs. regisafe"],
              "/vergleich/mandari-vs-sternberg/": ["Stand Juli 2026", "AGPL-3.0", "keine öffentliche Angabe", "Funktion / Kriterium"],
              "/vergleich/mandari-vs-allris/": ["ALLRIS", "Funktion / Kriterium"],
              "/vergleich/mandari-vs-somacos/": ["SessionNet", "Funktion / Kriterium"],
              "/vergleich/mandari-vs-regisafe/": ["BITV-Zertifikat", "Funktion / Kriterium"],
              "/releases/": ["mandari 0.11", "mandari 0.9 (Beta)"],
              "/releases/mandari-0-11/": ["Sitzungsdienst", "v0.11.0", "Vorherige Version"],
              "/releases/mandari-0-9-beta/": ["Tombstones", "v0.9.0-beta"],
              "/trust/": ["Subprocessoren"],
              "/transparenz/": ["Transparenzbericht", "Reichweite des Bürgerportals", "204.819"],
              "/impressum/": ["Impressum", "AGPL-3.0-or-later"],
              "/datenschutz/": ["Datenschutz"],
              "/agb/": ["AGB"],
              "/kontakt/": ["Kontakt"],
              "/sicherheit/disclosure/": ["Sicherheitslücke gefunden?", "Safe Harbor", 'id="hall-of-fame"', "5D06 A2BC B71C 6095 7A23"],
              "/crawler/": ["mandari-ingestor (+https://mandari.de/crawler)", "Kontakt und Widerspruch"],
          }
          # Dauerhafte Weiterleitungen (Blog ruht, Statusseite extern)
          redirects = {
              "/status/": "https://status.mandari.de/",
              "/blog/": "/releases/",
              "/blog/feed/": "/releases/",
          }
          errors = []
          for url, needles in checks.items():
              r = c.get(url)
              if r.status_code != 200:
                  errors.append(f"{url}: HTTP {r.status_code}")
                  continue
              body = r.content.decode("utf-8")
              for n in needles:
                  if n not in body:
                      errors.append(f"{url}: '{n}' fehlt")
          for url, target in redirects.items():
              r = c.get(url)
              if r.status_code != 301 or r.get("Location") != target:
                  errors.append(f"{url}: HTTP {r.status_code} -> {r.get('Location')} (erwartet 301 -> {target})")
          releases = c.get("/releases/").content.decode("utf-8")
          if releases.find("mandari 0.11") > releases.find("mandari 0.9 (Beta)"):
              errors.append("/releases/: neueste Version steht nicht zuerst")
          assert not errors, "Render-Smoke fehlgeschlagen: " + "; ".join(errors)
          print(f"OK: {len(checks)} Seiten gerendert, {len(redirects)} Weiterleitungen geprueft")
          EOF

      - name: Struktur-Test (alle Seiten verlinkt, keine toten Links, eindeutige Titel, Kopf- und Fußzeile)
        # Ausstehende Ziele der parallelen Relaunch-PRs sind Warnungen, siehe AUSSTEHENDE_PFADE im Skript;
        # nach dem Merge aller Relaunch-PRs mit --strict aufrufen.
        env:
          SITE_URL: "https://mandari.de"
        run: python scripts/check_site_structure.py

      - name: Sicherheitsfristen (security.txt und Policy wie SECURITY.md im mandari-Repository)
        # Eingangsbestätigung, Korrekturfristen und Offenlegung müssen mit der SECURITY.md von
        # mandariOSS/mandari übereinstimmen; alte Angaben (5 Werktage, 14 Tage) dürfen nicht zurückkehren.
        run: |
          python - <<'EOF'
          import os, django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "website.settings")
          os.environ.setdefault("ALLOWED_HOSTS", "testserver")
          django.setup()
          from django.test import Client
          c = Client()
          fristen = ["3 Werktage", "zwei Wochen", "72 Stunden", "7 Tage", "30 Tage", "90 Tage nach"]
          veraltet = ["5 Werktage", "14 Tage"]
          errors = []
          for url in ["/.well-known/security.txt", "/sicherheit/disclosure/"]:
              r = c.get(url)
              if r.status_code != 200:
                  errors.append(f"{url}: HTTP {r.status_code}")
                  continue
              # Zeilenumbrüche und Einrückung der Vorlage zählen als ein Leerzeichen.
              body = " ".join(r.content.decode("utf-8").split())
              errors += [f"{url}: '{f}' fehlt" for f in fristen if f not in body]
              errors += [f"{url}: veraltet '{v}'" for v in veraltet if v in body]
          assert not errors, "Sicherheitsfristen weichen ab: " + "; ".join(errors)
          print("OK: security.txt und Disclosure-Policy nennen die Fristen aus SECURITY.md")
          EOF

      - name: Anrede (Sie-Form auf Verwaltungs- und allgemeinen Seiten)
        # Du-Form nur auf /karriere/ und /mitmachen/ (Leitfaden mandari-texte). Geprüft wird der
        # sichtbare Text im Hauptbereich.
        run: |
          python - <<'EOF'
          import os, re, django
          from html.parser import HTMLParser
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "website.settings")
          os.environ.setdefault("ALLOWED_HOSTS", "testserver")
          django.setup()
          from django.test import Client

          class Main(HTMLParser):
              def __init__(self):
                  super().__init__(); self.depth = self.skip = 0; self.parts = []
              def handle_starttag(self, tag, attrs):
                  self.depth += tag == "main"; self.skip += tag in ("script", "style")
              def handle_endtag(self, tag):
                  self.depth -= tag == "main"; self.skip -= tag in ("script", "style")
              def handle_data(self, data):
                  if self.depth and not self.skip:
                      self.parts.append(data)

          du = re.compile(r"\b(du|dich|dir|dein\w*|euch|euer|eure\w*)\b", re.IGNORECASE)
          pages = ["/preise/", "/kommunen/", "/migration/", "/vergabe/", "/trust/", "/transparenz/", "/roadmap/",
                   "/barrierefreiheit/", "/abuse/", "/vergleich/", "/quellen/", "/agb/", "/avv/", "/kuendigung/",
                   "/sicherheit/disclosure/", "/crawler/"]
          c, errors = Client(), []
          for url in pages:
              r = c.get(url)
              if r.status_code != 200:
                  errors.append(f"{url}: HTTP {r.status_code}"); continue
              parser = Main(); parser.feed(r.content.decode("utf-8"))
              text = " ".join(" ".join(parser.parts).replace("\u00ad", "").split())  # ohne weiche Trennstriche
              errors += [f"{url}: …{text[max(0, m.start() - 30):m.end() + 20]}…" for m in du.finditer(text)]
          assert not errors, "Du-Form auf Sie-Seiten: " + "; ".join(errors)
          print(f"OK: {len(pages)} Seiten in Sie-Form")
          EOF

      - name: Ruhige Bestandsseiten (keine Leiste unter dem Hero, Pilotangebot einmal, eine Datenschutzadresse)
        # Was dort stehen muss und was nicht zurückkehren darf: Faktenleisten unter dem Hero, gelbe
        # Pilot-Kästen, zwei Aufrufe zum selben Formular, privacy@ statt datenschutz@, „Mandari“ groß.
        run: |
          python - <<'EOF'
          import os, django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "website.settings")
          os.environ.setdefault("ALLOWED_HOSTS", "testserver")
          django.setup()
          from django.test import Client
          c = Client()
          pages = {
              "/abuse/": (["Was möchten Sie melden?", "mailto:datenschutz@mandari.de"],
                          ["DSA &amp; NetzDG", "privacy@mandari.de", "Notfall-Kontakte"]),
              "/migration/": (["Bestandsaufnahme", "Pilotkommunen erhalten Sonderkonditionen", "/kontakt/?subject=Migration-Beratung#termin"],
                              ["Migrations-Gespräch", "Pilot-Kommunen bekommen Sonderkonditionen", "ersten 5", "Rollback"]),
              "/barrierefreiheit/": (["teilweise konform mit der BITV 2.0"], ["Letzte Prüfung:", "Wir sind ehrlich"]),
              "/mitmachen/": (["Such dir aus, was zu dir passt"], ["100 % Open Source", "IONOS"]),
              "/preise/": (["Pilotkommunen starten jetzt", "Rechenzentren in Deutschland"], ["Pilot-Phase 2026", "IONOS"]),
              "/kommunen/": (["Drei Bausteine", "Pilotkommunen gestalten mit."], ["Kurze Wege für die Datenschutzprüfung"]),
              "/quellen/": (["mandari aggregiert", "mandari nutzt", "mandari nimmt"], ["Mandari "]),
          }
          errors = []
          for url, (present, absent) in pages.items():
              r = c.get(url)
              if r.status_code != 200:
                  errors.append(f"{url}: HTTP {r.status_code}"); continue
              body = r.content.decode("utf-8")
              errors += [f"{url}: '{n}' fehlt" for n in present if n not in body]
              errors += [f"{url}: '{n}' ist zurück" for n in absent if n in body]
          assert not errors, "Bestandsseiten: " + "; ".join(errors)
          print(f"OK: {len(pages)} Bestandsseiten ruhig")
          EOF

      - name: Urheber- und Lizenzangabe (Fußzeile wie in mandariOSS/mandari)
        # Urheber ist Sven Konopka, Lizenz AGPL-3.0-or-later. Die Fußzeile muss das nennen, und jedes
        # Urheberzeichen in einer versionierten HTML-Datei muss den Urheber nennen (Ausnahme:
        # Namensnennung von OpenStreetMap).
        run: |
          python - <<'EOF'
          import os, re, subprocess, django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "website.settings")
          os.environ.setdefault("ALLOWED_HOSTS", "testserver")
          django.setup()
          from django.test import Client
          errors = []
          r = Client().get("/")
          if r.status_code != 200:
              errors.append(f"/: HTTP {r.status_code}")
          else:
              body = " ".join(r.content.decode("utf-8").split())
              muster = r"&copy; 2025–\d{4} Sven Konopka\. mandari ist Open Source unter der Lizenz AGPL-3\.0-or-later\."
              if not re.search(muster, body):
                  errors.append("/: Fußzeile ohne Urheber Sven Konopka und AGPL-3.0-or-later")
          dateien = subprocess.run(
              ["git", "ls-files", "*.html"], capture_output=True, text=True, check=True
          ).stdout.splitlines()
          for datei in dateien:
              with open(datei, encoding="utf-8", errors="replace") as fh:
                  for nr, zeile in enumerate(fh, 1):
                      if ("&copy;" in zeile or "©" in zeile) and not (
                          "Sven Konopka" in zeile or "OpenStreetMap" in zeile
                      ):
                          errors.append(f"{datei}:{nr}: Urheberangabe ohne Sven Konopka")
          assert not errors, "Urheberangabe weicht ab: " + "; ".join(errors)
          print(f"OK: Fußzeile und {len(dateien)} HTML-Dateien nennen den Urheber")
          EOF

      - name: Weiterleitungen Produkte (/produkt/ und /loesungen/)
        # /produkt/ ist aufgeteilt in /produkte/ und /fraktionen/; alte Adressen leiten dauerhaft weiter.
        run: |
          python - <<'EOF'
          import os, django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "website.settings")
          os.environ.setdefault("ALLOWED_HOSTS", "testserver")
          django.setup()
          from django.test import Client
          c = Client()
          redirects = {"/produkt/": "/fraktionen/", "/loesungen/": "/produkte/"}
          errors = []
          for url, target in redirects.items():
              r = c.get(url)
              if r.status_code != 301 or r.get("Location") != target:
                  errors.append(f"{url}: HTTP {r.status_code} -> {r.get('Location')} (erwartet 301 -> {target})")
          assert not errors, "Weiterleitungen fehlerhaft: " + "; ".join(errors)
          print(f"OK: {len(redirects)} Weiterleitungen")
          EOF

      - name: Ruhige Oberflaeche (kein Hover-Sprung, keine Verlaeufe, Pillen oder Viertelkreise)
        # Gestaltungsregeln: Zustaende aendern Farbe oder Unterstreichung, nie die Position. Alle Templates
        # kommen ohne Farbverlauf, Pillen-Etikett und Deko-Viertelkreis aus. Ausgenommen ist nur der ruhende
        # Blog (templates/blog/, siehe README „Blog reaktivieren“); vor dem Reaktivieren angleichen.
        run: |
          python - <<'EOF'
          import pathlib, re
          pille = re.compile(r'<span class="[^"]*\brounded-full\b[^"]*\bbg-[a-z]+-(?:50|100)\b')
          errors, geprueft = [], 0
          for f in sorted(pathlib.Path("templates").rglob("*.html")):
              text = f.read_text(encoding="utf-8")
              if re.search(r"hover:-?translate-y", text):
                  errors.append(f"{f}: Hover mit translate-y")
              if f.parts[1] == "blog":
                  continue
              geprueft += 1
              if "bg-gradient" in text:
                  errors.append(f"{f}: Farbverlauf")
              if "rounded-bl-full" in text:
                  errors.append(f"{f}: Deko-Viertelkreis")
              if pille.search(text):
                  errors.append(f"{f}: Pillen-Etikett")
          assert not errors, "; ".join(errors)
          print(f"OK: keine Hover-Spruenge; {geprueft} Templates ohne Verlauf, Pille und Viertelkreis")
          EOF
