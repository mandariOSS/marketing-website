{# Abschnittsüberschrift: H2 und ein Satz, linksbündig. Keine Pille darüber. #}
<div{% if self.anchor_id %} id="{{ self.anchor_id }}"{% endif %} class="max-w-3xl mb-12 lg:mb-14 ">
    <h2 class="t-h2 text-gray-900 dark:text-white">{{ self.title }}</h2>
    {% if self.subline %}<p class="t-lead text-gray-600 dark:text-gray-300 mt-5">{{ self.subline }}</p>{% endif %}
</div>
