{# Inhaltsverzeichnis: Überschrift und Sprungmarken, ohne Kasten. #}
<nav class="py-8" aria-label="{{ self.title }}">
    <div class="wrap">
        <h2 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">{{ self.title }}</h2>
        <ol class="grid grid-cols-1 sm:grid-cols-2 gap-x-10 gap-y-2 max-w-4xl text-[0.9375rem]">
            {% for item in self.items %}
            <li><a href="#{{ item.anchor }}" class="text-primary-700 dark:text-primary-300 hover:underline underline-offset-4">{{ item.number }} {{ item.text }}</a></li>
            {% endfor %}
        </ol>
    </div>
</nav>
