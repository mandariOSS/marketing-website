{% load baender %}
{# Inhaltsverzeichnis: Überschrift und Sprungmarken, ohne Kasten. #}
<nav class="{% abschnitt band band_anfang band_ende art='kompakt' %}" aria-label="{{ self.title }}">
    <div class="wrap">
        <h2 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">{{ self.title }}</h2>
        <ol class="grid grid-cols-1 sm:grid-cols-2 gap-x-12 gap-y-2 max-w-4xl text-base">
            {% for item in self.items %}
            <li><a href="#{{ item.anchor }}" class="textlink">{{ item.number }} {{ item.text }}</a></li>
            {% endfor %}
        </ol>
    </div>
</nav>
