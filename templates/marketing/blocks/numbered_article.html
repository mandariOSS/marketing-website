{% load baender %}
{# Nummerierter Artikel (Rechtstexte, Trust Center): Nummer als Teil der Überschrift (Dokumentstufe 28 px), ohne Kachel. #}
<section class="{% abschnitt band band_anfang band_ende %}">
    <div class="wrap">
        <article id="{{ self.anchor }}" class="prose prose-lg dark:prose-invert max-w-[45rem]">
            <h2 class="not-prose t-h2-dok text-gray-900 dark:text-white mb-6"><span class="text-gray-500 dark:text-gray-400 tabular-nums mr-2">{{ self.number }}</span>{{ self.title }}</h2>
            {{ self.body|safe }}
        </article>
    </div>
</section>
