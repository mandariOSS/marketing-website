{% load wagtailcore_tags %}
{# Raster aus Einträgen – Gruppierung über Abstand und Überschriften, keine Karten. #}
<section class="py-20 lg:py-24 {% if band %}band-{{ band }}{% elif self.background == 'gray' %}bg-mist{% endif %}">
    <div class="wrap">
        {% if self.header %}{% include_block self.header %}{% endif %}
        <div class="grid grid-cols-1 md:grid-cols-2 {% if self.columns == '4' %}lg:grid-cols-4{% else %}lg:grid-cols-3{% endif %} gap-x-10 gap-y-12 lg:gap-x-12">
            {% for card in self.cards %}{% include "marketing/blocks/_mandari_card.html" with card=card %}{% endfor %}
        </div>
    </div>
</section>
