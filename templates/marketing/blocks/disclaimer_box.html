{% load baender %}
{# Hinweis: ein Absatz auf leicht getönter Fläche, ohne Rahmen und Symbol; setzt meist das Band davor fort (Abstand eines Unterabschnitts). #}
<section class="{% abschnitt band band_anfang band_ende art='kompakt' %}">
    <div class="wrap">
        <div class="max-w-[45rem] rounded-lg px-5 py-4 bg-{{ self.color|default:'gray' }}-50 dark:bg-{{ self.color|default:'gray' }}-900/20 text-base text-gray-700 dark:text-gray-300 prose dark:prose-invert">{{ self.body|safe }}</div>
    </div>
</section>
