{% load wagtailcore_tags %}
{# Freier Text mit optionaler Überschrift #}
<section class="py-16 lg:py-20 {% if self.background == 'gray' %}bg-mist{% endif %}">
    <div class="wrap">
        {% if self.header %}{% include_block self.header %}{% endif %}
        <div class="prose prose-lg dark:prose-invert max-w-4xl prose-a:text-primary-700 dark:prose-a:text-primary-300">{{ self.body|safe }}</div>
    </div>
</section>
