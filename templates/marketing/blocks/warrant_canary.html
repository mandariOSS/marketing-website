{# Warrant Canary (Transparenzbericht): eigener Hinweis mit Stand-Datum #}
<section class="band-{{ band|default:'hell' }} {% if band_anfang %}pt-16 lg:pt-20{% else %}pt-0{% endif %} {% if band_ende %}pb-16 lg:pb-20{% else %}pb-6{% endif %}">
    <div class="wrap">
        <div class="max-w-4xl rounded-lg px-5 py-4 bg-amber-50 dark:bg-amber-900/20">
            <h3 class="font-semibold text-amber-900 dark:text-amber-100">Warrant Canary, Stand {{ self.date }}</h3>
            <div class="mt-2 text-[0.9375rem] text-amber-900 dark:text-amber-100 prose prose-sm dark:prose-invert max-w-none">{{ self.body|safe }}</div>
        </div>
    </div>
</section>
