{% load baender %}
{# Warrant Canary (Transparenzbericht): eigener Hinweis mit Stand-Datum #}
<section class="{% abschnitt band band_anfang band_ende art='kompakt' %}">
    <div class="wrap">
        <div class="max-w-[45rem] rounded-lg px-5 py-4 bg-amber-50 dark:bg-amber-900/20">
            <h3 class="font-semibold text-amber-900 dark:text-amber-100">Warrant Canary, Stand {{ self.date }}</h3>
            <div class="mt-2 text-base text-amber-900 dark:text-amber-100 prose dark:prose-invert max-w-none">{{ self.body|safe }}</div>
        </div>
    </div>
</section>
