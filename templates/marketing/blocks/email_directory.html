{% load baender wagtailcore_tags %}
{# E-Mail-Verzeichnis-Tabelle — RFC 2142 Style #}
<section class="{% abschnitt band band_anfang band_ende standard='grau' %}">
    <div class="wrap">
        {% if self.header %}{% include_block self.header %}{% endif %}
        <div class="max-w-5xl bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-50 dark:bg-gray-700/40 text-sm font-semibold text-gray-700 dark:text-gray-300">
                    <tr><th class="text-left px-6 py-3">E-Mail</th><th class="text-left px-6 py-3">Wofür</th></tr>
                </thead>
                <tbody class="divide-y divide-gray-200 dark:divide-gray-700 text-sm">
                    {% for e in self.entries %}
                    <tr>
                        <td class="px-6 py-3"><a href="mailto:{{ e.address }}" class="font-mono text-{{ e.color|default:'primary' }}-600 dark:text-{{ e.color|default:'primary' }}-400 hover:underline">{{ e.address }}</a></td>
                        <td class="px-6 py-3 text-gray-700 dark:text-gray-300">{{ e.purpose }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</section>
