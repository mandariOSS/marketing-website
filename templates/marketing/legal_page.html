{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
<article class="pt-16 pb-24 lg:pt-24 lg:pb-32">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="max-w-3xl">
            <h1 class="text-4xl lg:text-5xl font-semibold tracking-tight text-gray-900 dark:text-white">{{ page.title }}</h1>
            <div class="mt-10 prose prose-lg dark:prose-invert max-w-none prose-headings:tracking-tight prose-a:text-primary-700 dark:prose-a:text-primary-300 prose-a:decoration-primary-300 prose-a:underline-offset-4">
                {{ page.body|richtext }}
            </div>
        </div>
    </div>
</article>
{% endblock %}
