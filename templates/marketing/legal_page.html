{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
{# Rechtstext als Dokument: derselbe Seitenkopf wie überall (weiß, H1), der Text direkt darunter auf demselben Band, Überschriften in der Dokumentstufe #}
<article class="band-hell hero">
    <div class="wrap">
        <h1 class="t-h1 text-gray-900 dark:text-white max-w-5xl">{{ page.title }}</h1>
        <div class="mt-10 lg:mt-12 max-w-[45rem] prose prose-lg dark:prose-invert">
            {{ page.body|richtext }}
        </div>
    </div>
</article>
{% endblock %}
