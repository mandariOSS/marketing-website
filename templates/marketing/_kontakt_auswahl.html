{# Auswahlfeld der Kontaktformulare #}
<div>
    <label for="{{ id }}" class="block text-sm font-medium text-gray-900 dark:text-white">{{ label }}</label>
    <select id="{{ id }}" name="{{ field.html_name }}" required{% if field.errors %} aria-invalid="true" aria-describedby="{{ id }}-fehler"{% endif %}
            class="mt-1.5 block w-full rounded-lg border {% if field.errors %}border-red-600{% else %}border-gray-300 dark:border-gray-600{% endif %} bg-white dark:bg-gray-900 px-3.5 py-2.5 text-gray-900 dark:text-white focus:border-primary-600 focus:ring-2 focus:ring-primary-600/20 focus:outline-none">
        {% if placeholder %}<option value="">{{ placeholder }}</option>{% endif %}
        {% with current=field.value|default_if_none:""|stringformat:"s" %}
        {% for value, text in choices %}<option value="{{ value }}"{% if value == current %} selected{% endif %}>{{ text }}</option>{% endfor %}
        {% endwith %}
    </select>
    {% if field.errors %}<p id="{{ id }}-fehler" class="mt-1.5 text-sm text-red-700 dark:text-red-400">{{ field.errors.0 }}</p>{% endif %}
</div>
