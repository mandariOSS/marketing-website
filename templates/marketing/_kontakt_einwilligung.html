{# Einwilligung, Honigtopf und Spamschutz (Altcha, selbst gehostet, unsichtbar). Die Prüfung startet, sobald jemand ein Feld des Formulars betritt (auto="onfocus"), nicht schon beim Laden: Wer nur die Anschrift sucht, rechnet nichts. #}
<div>
    <div class="flex items-start gap-3">
        <input id="{{ id }}" name="{{ field.html_name }}" type="checkbox" value="on" required{% if field.value %} checked{% endif %}{% if field.errors %} aria-invalid="true" aria-describedby="{{ id }}-fehler"{% endif %}
               class="mt-1 h-5 w-5 flex-none rounded border-gray-300 dark:border-gray-600 text-primary-600 focus:ring-primary-600">
        <label for="{{ id }}" class="text-base text-gray-600 dark:text-gray-300">Ich habe die <a href="/datenschutz/#formular" class="textlink">Datenschutzerklärung</a> gelesen und bin einverstanden, dass Sie meine Angaben zur Bearbeitung der Anfrage verwenden.</label>
    </div>
    {% if field.errors %}<p id="{{ id }}-fehler" class="mt-1.5 text-sm text-red-700 dark:text-red-400">{{ field.errors.0 }}</p>{% endif %}
</div>
<div class="hidden" aria-hidden="true">
    <label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
</div>
<altcha-widget challengeurl="{{ ALTCHA_CHALLENGE_URL }}" auto="onfocus" hidefooter hidelogo
               style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;" aria-hidden="true"
               strings='{"label":"Spamschutz","verifying":"Prüfe …","verified":"Geprüft","error":"Fehler"}'></altcha-widget>
