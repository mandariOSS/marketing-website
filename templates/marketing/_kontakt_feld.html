{# Eingabefeld der Kontaktformulare: Beschriftung, Feld, Hinweis, Fehler #}
<div>
    <label for="{{ id }}" class="block text-sm font-medium text-gray-900 dark:text-white">{{ label }}{% if optional %} <span class="font-normal text-gray-600 dark:text-gray-400">(optional)</span>{% endif %}</label>
    {% if rows %}
    <textarea id="{{ id }}" name="{{ field.html_name }}" rows="{{ rows }}"{% if required %} required{% endif %}{% if placeholder %} placeholder="{{ placeholder }}"{% endif %}{% if field.errors %} aria-invalid="true" aria-describedby="{{ id }}-fehler"{% elif hint %} aria-describedby="{{ id }}-hinweis"{% endif %}
              class="mt-1.5 block w-full rounded-lg border {% if field.errors %}border-red-600{% else %}border-gray-300 dark:border-gray-600{% endif %} bg-white dark:bg-gray-900 px-3.5 py-2.5 text-gray-900 dark:text-white placeholder:text-gray-400 focus:border-primary-600 focus:ring-2 focus:ring-primary-600/20 focus:outline-none">{{ field.value|default_if_none:"" }}</textarea>
    {% else %}
    <input id="{{ id }}" name="{{ field.html_name }}" type="{{ type|default:'text' }}" value="{{ field.value|default_if_none:'' }}"{% if required %} required{% endif %}{% if autocomplete %} autocomplete="{{ autocomplete }}"{% endif %}{% if placeholder %} placeholder="{{ placeholder }}"{% endif %}{% if min %} min="{{ min }}"{% endif %}{% if field.errors %} aria-invalid="true" aria-describedby="{{ id }}-fehler"{% elif hint %} aria-describedby="{{ id }}-hinweis"{% endif %}
           class="mt-1.5 block w-full rounded-lg border {% if field.errors %}border-red-600{% else %}border-gray-300 dark:border-gray-600{% endif %} bg-white dark:bg-gray-900 px-3.5 py-2.5 text-gray-900 dark:text-white placeholder:text-gray-400 focus:border-primary-600 focus:ring-2 focus:ring-primary-600/20 focus:outline-none">
    {% endif %}
    {% if field.errors %}<p id="{{ id }}-fehler" class="mt-1.5 text-sm text-red-700 dark:text-red-400">{{ field.errors.0 }}</p>{% elif hint %}<p id="{{ id }}-hinweis" class="mt-1.5 text-sm text-gray-600 dark:text-gray-400">{{ hint }}</p>{% endif %}
</div>
